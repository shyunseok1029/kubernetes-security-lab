# 독립적인 개인 학습용 예제이며 WHS 팀 프로젝트 원본이 아니다.
# 이 웹앱은 Kubernetes API가 필요하지 않으므로 토큰을 자동 Mount하지 않는다.
apiVersion: v1
kind: Namespace
metadata:
  name: demo
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: demo-web
  namespace: demo
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-web
  namespace: demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: demo-web
  template:
    metadata:
      labels:
        app: demo-web
    spec:
      serviceAccountName: demo-web
      automountServiceAccountToken: false
      containers:
        - name: web
          image: demo/web:1.0
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
