# 독립적인 개인 학습용 예제이며 WHS 팀 프로젝트 원본이 아니다.
# ServiceAccount 토큰 Mount는 API 인증 설정이고, 아래 Role은 API 인가 설정이다.
apiVersion: v1
kind: Namespace
metadata:
  name: demo
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: report-reader
  namespace: demo
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: report-configmap-reader
  namespace: demo
rules:
  - apiGroups:
      - ""
    resources:
      - configmaps
    resourceNames:
      - public-report-config
    verbs:
      - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: report-configmap-reader
  namespace: demo
subjects:
  - kind: ServiceAccount
    name: report-reader
    namespace: demo
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: report-configmap-reader
